<!DOCTYPE html>
<html ng-app="app">
<head>
    <meta charset="UTF-8">
    <title>Monaco Lazy Load with CDN POC</title>

    <!-- AngularJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.2/angular.min.js"></script>
    <h1>Monaco Lazy Load with CDN POC</h1>
    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }

        #editor {
            height: 400px;
            border: 1px solid #ccc;
            margin-top: 10px;
        }

        .toolbar {
            margin-bottom: 10px;
        }

        .output {
            margin-top: 10px;
            background: #111;
            color: #0f0;
            padding: 10px;
            height: 120px;
            overflow: auto;
        }
    </style>
</head>

<body ng-controller="MainCtrl">

    <div class="toolbar">
        <button ng-click="loadEditor()">Load Editor</button>

        <select ng-model="language" ng-change="changeLanguage()">
            <option value="javascript">JavaScript</option>
            <option value="python">Python</option>
            <option value="cpp">C++</option>
        </select>

        <button ng-click="runCode()">Run</button>
    </div>

    <div id="editor"></div>

    <div class="output">
        {{output}}
    </div>

    <script>
        var app = angular.module('app', []);

        app.controller('MainCtrl', function ($scope) {

            let editor = null;
            let isEditorLoaded = false;

            $scope.language = "javascript";
            $scope.output = "Click 'Load Editor' to start...";

            function getBoilerplate(lang) {
                switch (lang) {
                    case "python":
                        return "print('Hello World')";
                    case "cpp":
                        return "#include <iostream>\nusing namespace std;\nint main() {\n  cout << \"Hello\";\n}";
                    default:
                        return "console.log('Hello World');";
                }
            }

            // 🔥 Lazy load Monaco
            $scope.loadEditor = function () {

                if (isEditorLoaded) return;

                var script = document.createElement("script");
                script.src = "https://unpkg.com/monaco-editor@0.45.0/min/vs/loader.js";

                script.onload = function () {

                    require.config({
                        paths: {
                            vs: "https://unpkg.com/monaco-editor@0.45.0/min/vs"
                        }
                    });

                    require(["vs/editor/editor.main"], function () {

                        editor = monaco.editor.create(document.getElementById("editor"), {
                            value: getBoilerplate($scope.language),
                            language: $scope.language,
                            theme: "vs-dark",
                            automaticLayout: true
                        });

                        isEditorLoaded = true;
                    });
                };

                document.body.appendChild(script);
            };

            // 🔄 Change Language
            $scope.changeLanguage = function () {

                if (!editor) return;

                monaco.editor.setModelLanguage(editor.getModel(), $scope.language);
                editor.setValue(getBoilerplate($scope.language));
            };

            // ▶️ Run Code (JS only for POC)
            $scope.runCode = function () {

                if (!editor) return;

                var code = editor.getValue();

                if ($scope.language === "javascript") {
                    try {
                        var result = eval(code);
                        $scope.output = result !== undefined ? result : "Code executed successfully";
                    } catch (e) {
                        $scope.output = e.message;
                    }
                } else {
                    $scope.output = "Execution supported only for JavaScript in this POC.";
                }
            };

        });
    </script>

</body>
</html>
